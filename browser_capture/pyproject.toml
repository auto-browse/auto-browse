[project]
name = "browser-capture"
version = "0.1.0"
description = "DOM tree building and screenshot capture utilities for browser-use"
authors = [
    {name = "Gurvinder Dhillon", email = "gurvinder.dhillon@example.com"}
]
dependencies = [
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",
    "loguru>=0.7.0",
    "beautifulsoup4>=4.9.0",
    "lxml>=4.9.0",
    "Pillow>=10.0.0",
    "playwright>=1.40.0"
]
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.dev-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "playwright>=1.40.0",
]
lint = [
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
