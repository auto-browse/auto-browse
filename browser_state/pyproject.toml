[project]
name = "browser-state"
version = "0.1.0"
description = "Browser state management utilities using Playwright directly"
authors = [
    {name = "Gurvinder Dhillon", email = "gurvinder.dhillon@example.com"}
]
dependencies = [
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",
    "loguru>=0.7.0",
    "playwright>=1.40.0",
    "browser-capture>=0.1.0"
]
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.dev-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "playwright>=1.40.0",
]
lint = [
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]
